# Lives in /opt/tara on the server, next to .env (never committed).
services:
  api:
    image: ghcr.io/unfazed7/tara-api:latest
    restart: unless-stopped
    # AI_ENABLED (and the optional DEMO_ENABLED) come from .env: AI_ENABLED=false turns model runs off for analysts
    # (they see only the demo TARA); admins keep AI. See env.example.
    env_file: .env
    environment:
      ALLOWED_ORIGINS: https://aegis0212.duckdns.org
      # Keep model-call audit log and run log on the persistent /data volume (survive redeploys)
      LLM_AUDIT_FILE: /data/audit/llm-calls.jsonl
      LOG_FILE: /data/logs/aegis.log
      # Compose refuses to start the API if the invite code is missing from /opt/tara/.env
      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:?set REGISTRATION_INVITE_CODE in /opt/tara/.env}
    volumes:
      - tara_data:/data              # SQLite DB, audit log, run logs
      - tara_uploads:/app/uploads    # uploaded files
      - tara_artifacts:/app/artifacts  # stage outputs
    mem_limit: 600m
  web:
    image: ghcr.io/unfazed7/tara-web:latest
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
volumes:
  tara_data:
  tara_uploads:
  tara_artifacts:
  caddy_data:
  caddy_config:
