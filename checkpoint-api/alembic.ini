# Alembic manages the Stage 01 and Stage 02 tables only (checkpoint_api/stage_models.py, D-42).
# The older tables are still created by Base.metadata.create_all in main.py.
# New migration: alembic revision --autogenerate -m "what changed"
[alembic]
script_location = checkpoint_api/migrations
prepend_sys_path = .
