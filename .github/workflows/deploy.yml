name: Build and deploy

on:
  push:
    branches: [deploy/oracle-setup]
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # lets the built-in token push images to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: api
        uses: docker/metadata-action@v5      # builds the lowercase image name
        with:
          images: ghcr.io/${{ github.repository_owner }}/tara-api
          tags: type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.api.outputs.tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - id: web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tara-web
          tags: type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.web.outputs.tags }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy compose file and scripts to server
        run: scp -i ~/.ssh/deploy_key deploy/docker-compose.yml deploy/backup.sh deploy/make-admin.sh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/tara/"
      - name: Pull new images and restart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'docker login ghcr.io -u ${{ github.actor }} --password-stdin && cd /opt/tara && docker compose pull && docker compose up -d && docker image prune -f'
